ktor {
  development = false
  development = ${?KTOR_DEVELOPMENT}
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [
      com.ctfp.plugins.HttpKt.configureHttp
      com.ctfp.plugins.MonitoringKt.configureMonitoring
      com.ctfp.plugins.SerializationKt.configureSerialization
      com.ctfp.plugins.SecurityKt.configureSecurity
      com.ctfp.plugins.AutoHeadResponseKt.configureAutoHeadResponse
      com.ctfp.plugins.RequestValidationKt.configureRequestValidation
      com.ctfp.plugins.StatusPagesKt.configureStatusPages
      com.ctfp.plugins.ExposedKt.configureExposed
      com.ctfp.plugins.SeedKt.configureSeed
      com.ctfp.plugins.RateLimitingKt.configureRateLimiting
      com.ctfp.plugins.RoutingKt.configureRouting
    ]
  }
}

jwt {
  issuer = "ctfp-api"
  audience = "ctfp-frontend"
  realm = "ctfp"
  secret = "dev-only-insecure-jwt-secret-change-me"
  secret = ${?JWT_SECRET}
  ttlHours = 168
  ttlHours = ${?JWT_TTL_HOURS}
}

seed = true
seed = ${?SEED}

postgres {
  embedded = true
  embedded = ${?POSTGRES_EMBEDDED}
  url = "jdbc:postgresql://localhost:5432/ctfp"
  url = ${?POSTGRES_URL}
  user = "ctfp"
  user = ${?POSTGRES_USER}
  password = "ctfp"
  password = ${?POSTGRES_PASSWORD}
}

settings {
  file = "data/settings.conf"
  file = ${?SETTINGS_FILE}
}

mail {
  from = "CTF+ <noreply@localhost>"
  from = ${?MAIL_FROM}
  # Where the frontend is served; reset links point there.
  publicUrl = "http://localhost:5173"
  publicUrl = ${?PUBLIC_URL}
  smtp {
    host = ""
    host = ${?SMTP_HOST}
    # STARTTLS (587), TLS (465), STARTTLS_IF_AVAILABLE or NONE (25)
    security = "STARTTLS"
    security = ${?SMTP_SECURITY}
    port = 0 # 0: the usual port for the security mode
    port = ${?SMTP_PORT}
    username = ""
    username = ${?SMTP_USERNAME}
    password = ""
    password = ${?SMTP_PASSWORD}
  }
}

uploads {
  dir = "data/uploads"
  dir = ${?UPLOADS_DIR}
  maxBytes = 524288000 # 500 MiB
  maxBytes = ${?UPLOADS_MAX_BYTES}
}

kind = Application
