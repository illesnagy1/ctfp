name: ctfp

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
      # Uploads stream through the frontend; keep this a bit above the api's UPLOADS_MAX_BYTES (500 MiB).
      BODY_SIZE_LIMIT: 501M
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_EMBEDDED: "false"
      POSTGRES_URL: jdbc:postgresql://db:5432/ctfp
      POSTGRES_USER: ctfp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctfp}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to 32+ random characters}
    volumes:
      # settings.conf and uploads/ (see api/Containerfile)
      - api-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ctfp
      POSTGRES_USER: ctfp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctfp}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfp -d ctfp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  api-data:
  db-data:
  redis-data:
