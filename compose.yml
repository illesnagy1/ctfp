name: ctfp

services:
  api:
    build:
      context: ./api
      dockerfile: Containerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # settings.conf and uploads/ (see api/Containerfile)
      - api-data:/data
    environment:
      POSTGRES_EMBEDDED: "false"
      POSTGRES_URL: jdbc:postgresql://db:5432/ctfp
      POSTGRES_USER: ctfp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctfp}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to 32+ random characters}
    ports:
      - '127.0.0.1:8080:8080' # frontend reaches the api over the compose network
    restart: unless-stopped
    mem_limit: 1g

  db:
    image: docker.io/postgres:18-alpine
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ctfp
      POSTGRES_USER: ctfp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctfp}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ctfp -d ctfp" ]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
      # Uploads stream through the frontend; keep this a bit above the api's UPLOADS_MAX_BYTES (500 MiB).
      BODY_SIZE_LIMIT: 501M
      REDIS_URL: redis://redis:6379
    ports:
      - '0.0.0.0:3000:3000'
    restart: unless-stopped

  redis:
    image: docker.io/redis:8-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  api-data:
  db-data:
  redis-data:
